name: ci

# The offline gate and the publish audit. No secrets are needed: `make test` never contacts Terra or GCE.
# With no profile in CI, `make audit` checks only credential and home-path shapes, so run it locally too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: make test
        run: make test PYTHON=python

      - name: make pytest
        run: make pytest PYTHON=python

      - name: make audit
        run: make audit PYTHON=python

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (errors only)
        run: git ls-files '*.sh' gsvtk | xargs shellcheck -S error
